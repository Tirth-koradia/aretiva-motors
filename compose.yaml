name: aretiva-motors

services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aretiva}
      POSTGRES_USER: ${POSTGRES_USER:-aretiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aretiva_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aretiva} -d ${POSTGRES_DB:-aretiva}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: runtime
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-aretiva}:${POSTGRES_PASSWORD:-aretiva_dev}@database:5432/${POSTGRES_DB:-aretiva}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      database:
        condition: service_healthy
    profiles: ["full"]

  frontend:
    build:
      context: ./frontend
      target: runtime
    ports:
      - "3000:80"
    depends_on:
      - backend
    profiles: ["full"]

volumes:
  postgres-data:
