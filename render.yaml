databases:
  - name: aretiva-db
    databaseName: aretiva
    user: aretiva
    plan: free
    region: oregon

services:
  - type: web
    name: aretiva-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -e .
    startCommand: alembic upgrade head && uvicorn aretiva.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aretiva-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@aretiva.com
      - key: ADMIN_PASSWORD
        value: ChangeMe123!
      - key: CORS_ORIGINS
        value: "*"
