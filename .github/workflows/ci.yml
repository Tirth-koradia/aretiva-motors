name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    name: Backend – lint, typecheck, tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aretiva_test
          POSTGRES_USER: aretiva
          POSTGRES_PASSWORD: aretiva_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aretiva -d aretiva_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql+psycopg://aretiva:aretiva_test@localhost:5432/aretiva_test
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      JWT_ISSUER: aretiva-ci
      JWT_AUDIENCE: aretiva-ci
      ADMIN_EMAIL: admin@test.invalid
      ADMIN_PASSWORD: Admin1234!

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install backend dependencies
        run: pip install -e '.[dev]'

      - name: Ruff – lint
        run: ruff check .

      - name: Ruff – format check
        run: ruff format --check .

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Pytest
        run: python -m pytest -q --tb=short

  # ── Frontend ─────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend – lint, typecheck, tests, build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Vitest
        run: npm test -- --run

      - name: Production build
        run: npm run build
