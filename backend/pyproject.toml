[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "aretiva-api"
version = "0.1.0"
description = "FastAPI backend for Aretiva Motors"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.20.1",
  "anyio==4.15.1",
  "email-validator==2.3.0",
  "fastapi==0.162.0",
  "psycopg[binary]==3.3.6",
  "pwdlib[argon2]==0.3.1",
  "pydantic-settings==2.16.1",
  "PyJWT[crypto]==2.15.1",
  "sqlalchemy[asyncio]==2.1.6",
  "uvicorn[standard]==0.53.0",
]

[project.scripts]
aretiva-admin = "aretiva.cli:main"

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.16.8",
  "testcontainers[postgres]==4.15.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aretiva"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

